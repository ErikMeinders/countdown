AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multiplayer backend for the Countdown numbers round. An API Gateway WebSocket
  API fronts a single Lambda that routes every action, backed by one DynamoDB
  single-table store with a connection GSI and TTL-based expiry. Deploy with
  `aws cloudformation deploy` — the Makefile packages the Lambda first.

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name; tags resources and names the deployment stage.
    AllowedPattern: '[a-z0-9-]+'

  RoomTtlSeconds:
    Type: Number
    Default: 86400
    Description: How long a room and its data live before DynamoDB TTL reaps them.
    MinValue: 300

  LogLevel:
    Type: String
    Default: INFO
    Description: Lambda log level.
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: How long CloudWatch keeps the Lambda's logs.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

  RoundDurationSeconds:
    Type: Number
    Default: 45
    Description: Playing time per round, matching the frontend's longest clock.

  LambdaS3Bucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda ZIP (set by `make deploy`).

  LambdaS3Key:
    Type: String
    Description: S3 key of the packaged Lambda ZIP (set by `make deploy`).

Resources:

  # ── Data ───────────────────────────────────────────────────────────────
  # Single table. Everything for one match lives in the ROOM#<code> partition;
  # the ConnectionIndex GSI resolves a bare connection ID at $disconnect. See
  # backend/README.md for the full key design.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'countdown-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ConnectionIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: app
          Value: countdown
        - Key: component
          Value: backend
        - Key: environment
          Value: !Ref Environment

  # ── Compute ────────────────────────────────────────────────────────────
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/countdown-ws-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${FunctionLogGroup.Arn}:*'
        - PolicyName: dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub '${Table.Arn}/index/ConnectionIndex'
        - PolicyName: websocket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'countdown-ws-${Environment}'
      Runtime: python3.13
      Handler: app.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ENVIRONMENT: !Ref Environment
          ROOM_TTL_SECONDS: !Ref RoomTtlSeconds
          ROUND_DURATION_SECONDS: !Ref RoundDurationSeconds
          LOG_LEVEL: !Ref LogLevel
      Tags:
        - Key: app
          Value: countdown
        - Key: component
          Value: backend
        - Key: environment
          Value: !Ref Environment

  # ── WebSocket API ──────────────────────────────────────────────────────
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'countdown-ws-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        app: countdown
        component: backend
        environment: !Ref Environment

  # One integration serves every route; the Lambda routes internally.
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${Integration}'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${Integration}'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${Integration}'

  CreateRoomRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: createRoom
      Target: !Sub 'integrations/${Integration}'

  JoinRoomRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: joinRoom
      Target: !Sub 'integrations/${Integration}'

  ReadyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: ready
      Target: !Sub 'integrations/${Integration}'

  SubmitAnswerRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: submitAnswer
      Target: !Sub 'integrations/${Integration}'

  NextRoundRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: nextRound
      Target: !Sub 'integrations/${Integration}'

  PingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: ping
      Target: !Sub 'integrations/${Integration}'

  # API Gateway needs explicit permission to invoke the function.
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - DefaultRoute
      - CreateRoomRoute
      - JoinRoomRoute
      - ReadyRoute
      - SubmitAnswerRoute
      - NextRoundRoute
      - PingRoute
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true
      DefaultRouteSettings:
        DataTraceEnabled: false
        LoggingLevel: INFO
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      Tags:
        app: countdown
        component: backend
        environment: !Ref Environment

Outputs:
  WebSocketUrl:
    Description: WebSocket endpoint for the frontend (wss://...).
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  WebSocketApiId:
    Description: API Gateway WebSocket API ID.
    Value: !Ref WebSocketApi
  DeploymentStage:
    Description: The deployed stage name.
    Value: !Ref Environment
  TableName:
    Description: DynamoDB single-table name.
    Value: !Ref Table
  FunctionName:
    Description: Lambda function name.
    Value: !Ref Function
