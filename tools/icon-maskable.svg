<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-12%" r="145%">
      <stop offset="0%"  stop-color="#18233c"/>
      <stop offset="45%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#080a12"/>
    </radialGradient>
    <!-- Soft cyan halo behind the whole block, so the motif reads as lit. -->
    <radialGradient id="halo" cx="50%" cy="42%" r="46%">
      <stop offset="0%"  stop-color="#43ddcd" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#43ddcd" stop-opacity="0"/>
    </radialGradient>
    <!-- Bevel highlight down the top half of each window. -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- The reel lip fade from src/components/SlotNumber.jsx, softened so it
         frames the digit without dimming it. -->
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(6,9,16,0.85)"/>
      <stop offset="22%" stop-color="rgba(6,9,16,0)"/>
      <stop offset="78%" stop-color="rgba(6,9,16,0)"/>
      <stop offset="100%" stop-color="rgba(6,9,16,0.85)"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <!-- Cyan bloom behind the digit, the glow the app gives the target. -->
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#5ce8da" flood-opacity="0.62"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256.0" cy="256.0"
           rx="250.6" ry="105.3" fill="url(#halo)"/>
  
    <g>
      <!-- Recessed face. A dark drop-shadow lifts it off the gradient; the
           bright inner top edge is the bevel that makes it read as glass. -->
      <rect x="63.2" y="180.8" width="120.0" height="150.4"
            rx="14.4" fill="#000206" filter="url(#lift)"/>
      <rect x="64.8" y="182.4"
            width="116.8" height="147.2"
            rx="12.8" fill="none"
            stroke="rgba(255,255,255,0.40)" stroke-width="3.20"/>
      <rect x="64.8" y="182.4"
            width="116.8" height="75.2"
            rx="12.8" fill="url(#bevel)"/>
      <text x="123.2" y="257.6" fill="#5ce8da"
            font-family="JetBrains Mono" font-weight="700"
            font-size="120" text-anchor="middle"
            dominant-baseline="central" filter="url(#bloom)">9</text>
      <rect x="63.2" y="180.8" width="120.0" height="150.4"
            rx="14.4" fill="url(#lip)"/>
    </g>
    <g>
      <!-- Recessed face. A dark drop-shadow lifts it off the gradient; the
           bright inner top edge is the bevel that makes it read as glass. -->
      <rect x="196.0" y="180.8" width="120.0" height="150.4"
            rx="14.4" fill="#000206" filter="url(#lift)"/>
      <rect x="197.6" y="182.4"
            width="116.8" height="147.2"
            rx="12.8" fill="none"
            stroke="rgba(255,255,255,0.40)" stroke-width="3.20"/>
      <rect x="197.6" y="182.4"
            width="116.8" height="75.2"
            rx="12.8" fill="url(#bevel)"/>
      <text x="256.0" y="257.6" fill="#5ce8da"
            font-family="JetBrains Mono" font-weight="700"
            font-size="120" text-anchor="middle"
            dominant-baseline="central" filter="url(#bloom)">5</text>
      <rect x="196.0" y="180.8" width="120.0" height="150.4"
            rx="14.4" fill="url(#lip)"/>
    </g>
    <g>
      <!-- Recessed face. A dark drop-shadow lifts it off the gradient; the
           bright inner top edge is the bevel that makes it read as glass. -->
      <rect x="328.8" y="180.8" width="120.0" height="150.4"
            rx="14.4" fill="#000206" filter="url(#lift)"/>
      <rect x="330.4" y="182.4"
            width="116.8" height="147.2"
            rx="12.8" fill="none"
            stroke="rgba(255,255,255,0.40)" stroke-width="3.20"/>
      <rect x="330.4" y="182.4"
            width="116.8" height="75.2"
            rx="12.8" fill="url(#bevel)"/>
      <text x="388.8" y="257.6" fill="#5ce8da"
            font-family="JetBrains Mono" font-weight="700"
            font-size="120" text-anchor="middle"
            dominant-baseline="central" filter="url(#bloom)">2</text>
      <rect x="328.8" y="180.8" width="120.0" height="150.4"
            rx="14.4" fill="url(#lip)"/>
    </g>
</svg>