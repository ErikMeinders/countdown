<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-12%" r="145%">
      <stop offset="0%"  stop-color="#18233c"/>
      <stop offset="45%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#080a12"/>
    </radialGradient>
    <radialGradient id="ringhalo" cx="50%" cy="50%" r="52%">
      <stop offset="0%"  stop-color="#f4d46f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f4d46f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5ce8da"/>
      <stop offset="52%"  stop-color="#f4d46f"/>
      <stop offset="100%" stop-color="#e2603f"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(6,9,16,0.85)"/>
      <stop offset="22%" stop-color="rgba(6,9,16,0)"/>
      <stop offset="78%" stop-color="rgba(6,9,16,0)"/>
      <stop offset="100%" stop-color="rgba(6,9,16,0.85)"/>
    </linearGradient>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
  <feFlood flood-color="#5ce8da" flood-opacity="0.62"/>
  <feComposite in2="b" operator="in" result="glow"/>
  <feMerge>
    <feMergeNode in="glow"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.7"/>
</filter>
    <filter id="ringlift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256.0" cy="256.0" r="172" fill="none" stroke="url(#ringhalo)" stroke-width="58"/>
  <!-- The ring: a full sweep, broken at the top by a dark notch so it reads
       as a running countdown rather than a closed loop. -->
  <circle cx="256.0" cy="256.0" r="172" fill="none" stroke="url(#ringGrad)"
          stroke-width="36" stroke-linecap="round" filter="url(#ringlift)"/>
  <rect x="236.0" y="65.0" width="40" height="40"
        rx="8" fill="#080a12"/>
  <!-- Recessed face behind the target. -->
  <rect x="148.0" y="172.0" width="216" height="168" rx="26"
        fill="#000206" filter="url(#lift)"/>
  <rect x="148.0" y="172.0" width="216" height="168" rx="26"
        fill="url(#lip)"/>
  <text x="256.0" y="258.0" fill="#5ce8da" font-family="JetBrains Mono"
        font-weight="700" font-size="132" text-anchor="middle"
        dominant-baseline="central" filter="url(#bloom)">952</text>
</svg>