<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdown</title>

<!-- viewport-fit=cover lets us paint under the notch and home indicator.
     user-scalable=no matters here: without it iOS treats a double-tap as
     zoom, which would fight the double-tap-to-undo gesture. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">

<meta name="theme-color" content="#080a12">
<meta name="color-scheme" content="dark">
<meta name="description" content="The Countdown numbers round.">

<!-- Standalone launch (no Safari chrome) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">

<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">

<style>
  /* Self-hosted, so the app keeps its type with no signal — the Google Fonts
     CDN can't be reached offline, and the icon is rendered from the same
     JetBrains Mono, so the two can't drift. Files live in public/fonts and are
     precached by the service worker. */
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: swap;
    src: url('./fonts/jetbrains-mono-400.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-display: swap;
    src: url('./fonts/jetbrains-mono-500.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-display: swap;
    src: url('./fonts/jetbrains-mono-700.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 300; font-display: swap;
    src: url('./fonts/outfit-300.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 500; font-display: swap;
    src: url('./fonts/outfit-500.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 700; font-display: swap;
    src: url('./fonts/outfit-700.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 900; font-display: swap;
    src: url('./fonts/outfit-900.woff2') format('woff2'); }

  :root { color-scheme: dark; }

  html, body {
    margin: 0; padding: 0;
    background: #080a12;
    min-height: 100%;
    /* Stop the whole page rubber-banding when you drag on the board. */
    overscroll-behavior: none;
  }

  body {
    /* Taps shouldn't select numerals or pop the callout menu. */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    /* Removes the 300ms click delay and suppresses double-tap zoom. */
    touch-action: manipulation;
  }

  /* iOS paints its own light background and tap flash on buttons, which
     shows as a white blink on a dark UI. Strip all of it. */
  button {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    -webkit-touch-callout: none;
    touch-action: manipulation;
    background-clip: padding-box;
  }

  /* Keep the UI clear of the notch and the home indicator. */
  #root {
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }

  /* Shown only if the bundle fails to boot. */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 500 13px/1.6 ui-monospace, monospace; color: #5a6478;
    text-align: center; padding: 24px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">loading…</div>
  <script>
    // Clear the fallback once React has mounted something.
    window.addEventListener("load", function () {
      setTimeout(function () {
        var r = document.getElementById("root"), b = document.getElementById("boot");
        if (b && r && r.childElementCount > 0) b.remove();
        else if (b) b.textContent = "Failed to load. Pull down to refresh.";
      }, 400);
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
